apiVersion: 1

providers:
  # One Grafana folder per directory under dashboards/ (Germinal/,
  # Leviosa/): each app's dashboards sit next to its alert rules.
  - name: homelab
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana-dashboards
      foldersFromFilesStructure: true
