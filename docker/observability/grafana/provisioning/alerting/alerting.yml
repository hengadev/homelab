apiVersion: 1

# TELEGRAM_* are expanded from the container environment (.env). Alert
# templates' $labels / $values are left alone (checked on Grafana 13.2).

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: "$TELEGRAM_CHAT_ID"

policies:
  - orgId: 1
    receiver: telegram
    group_by: [alertname, env]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: germinal
    folder: Germinal
    interval: 1m
    rules:
      # ── Seen from outside (blackbox, through Cloudflare) ─────────────────
      - uid: germinal-site-down
        title: Germinal site down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: min by (env, instance) (probe_success{app="germinal"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} has not answered 200 for 2 minutes"

      - uid: germinal-tls-expiry
        title: Germinal TLS certificate expiring
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: min by (env, instance) ((probe_ssl_earliest_cert_expiry{app="germinal"} - time()) / 86400)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [14] }
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "The certificate served for {{ $labels.instance }} expires in {{ humanize $values.A.Value }} days"

      # ── Seen from inside (the Alloy agent on the Germinal VPS) ────────────
      - uid: germinal-metrics-missing
        title: Germinal app metrics missing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              # Absent series count as down (0), so a dead agent still
              # yields one alert per environment, with its env label
              expr: >-
                max by (env) (up{job="germinal_app"})
                or label_replace(vector(0), "env", "prod", "", "")
                or label_replace(vector(0), "env", "staging", "", "")
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "No metrics from the {{ $labels.env }} app for 5 minutes (app down, or the Alloy agent stopped pushing)"

      - uid: germinal-5xx
        title: Germinal server errors
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: sum by (env) (increase(http_requests_total{job="germinal_app", env="prod", status_code=~"5.."}[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ humanize $values.A.Value }} 5xx responses in production over the last 10 minutes — see GlitchTip"

      - uid: germinal-restarts
        title: Germinal app restarting
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: max by (env) (changes(process_start_time_seconds{job="germinal_app"}[30m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "The {{ $labels.env }} app restarted {{ $values.A.Value }} times in 30 minutes (crash loop or out of memory?)"

      - uid: germinal-disk
        title: Germinal VPS disk filling up
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: max by (host, mountpoint) (100 * (1 - node_filesystem_avail_bytes{host="germinal-vps", fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{host="germinal-vps", fstype!~"tmpfs|overlay|squashfs"}))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [85] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.mountpoint }} is {{ humanize $values.A.Value }}% full"

      - uid: germinal-memory
        title: Germinal VPS memory exhausted
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: max by (host) (100 * (1 - node_memory_MemAvailable_bytes{host="germinal-vps"} / node_memory_MemTotal_bytes{host="germinal-vps"}))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Memory is {{ humanize $values.A.Value }}% used"

      # The backup job writes this heartbeat after a successful run (03:00
      # Europe/Paris); a day and two hours without one means a run failed.
      - uid: germinal-backup-stale
        title: Germinal backup missing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              # No heartbeat at all reads as -1 (the annotation says so)
              expr: >-
                (time() - max(germinal_backup_last_success_timestamp_seconds)) / 3600
                or vector(-1)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: outside_range, params: [0, 26] }
        for: 0s
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "{{ if lt $values.A.Value 0.0 }}No backup heartbeat has ever reached Grafana (agent not running, or no backup has succeeded since it started){{ else }}No successful Germinal backup for {{ humanize $values.A.Value }} hours{{ end }}"
