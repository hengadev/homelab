services:
  caddy:
    image: caddy:2-alpine
    container_name: homelab-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /opt/homelab/data/releases:/srv/releases:ro
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - internal
      - proxy

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: homelab-vaultwarden
    volumes:
      - /opt/homelab/data/vaultwarden:/data
    env_file:
      - .env
    environment:
      - DOMAIN=https://vault.${DOMAIN}
      - SIGNUPS_ALLOWED=false
    restart: unless-stopped
    networks:
      - internal

  portfolio:
    image: henga/portfolio:latest
    container_name: homelab-portfolio
    environment:
      - COMING_SOON=false
    restart: unless-stopped
    networks:
      - internal

  anki:
    build: ./anki
    container_name: homelab-anki
    volumes:
      - /opt/homelab/data/anki:/anki-data
    env_file:
      - .env
    environment:
      - SYNC_BASE=/anki-data
      - SYNC_USER1=${ANKI_SYNC_USER1}
      - SYNC_PORT=27701
    restart: unless-stopped
    networks:
      - internal

  anki-api:
    build: ./anki-api
    container_name: homelab-anki-api
    volumes:
      - /opt/homelab/data/anki:/anki-data
    env_file:
      - .env
    environment:
      - SYNC_BASE=/anki-data
      - ANKI_API_KEY=${ANKI_API_KEY}
    restart: unless-stopped
    networks:
      - internal

  vaultwarden-backup:
    image: alpine:3.19
    container_name: homelab-backup
    volumes:
      - /opt/homelab/data/vaultwarden:/data:ro
      - /opt/homelab/data/anki:/anki-data:ro
      - /opt/homelab/data/woodpecker:/woodpecker-data:ro
      - ./backup.sh:/backup.sh:ro
    environment:
      # Map dedicated backup IAM credentials to standard AWS env vars inside the container
      - AWS_ACCESS_KEY_ID=${BACKUP_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${BACKUP_AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE}
      - INFISICAL_DB_PASSWORD=${INFISICAL_DB_PASSWORD}
      - GLITCHTIP_DB_PASSWORD=${GLITCHTIP_DB_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache aws-cli gnupg curl postgresql14-client
        echo "0 3 * * * /backup.sh >> /var/log/backup.log 2>&1" | crontab -
        crond -f -l 8
    depends_on:
      - infisical-db
      - glitchtip-db
    restart: unless-stopped
    networks:
      - internal

  leviosa-demo:
    image: henga/leviosa:frontend-latest
    container_name: homelab-leviosa-demo
    environment:
      - USE_MOCK_DATA=true
      - COMING_SOON=false
      - SESSION_COOKIE_NAME=leviosa_session
      - MOCK_ADMIN_EMAIL=${LEVIOSA_DEMO_ADMIN_EMAIL}
      - MOCK_ADMIN_PASSWORD=${LEVIOSA_DEMO_ADMIN_PASSWORD}
      - MOCK_PARTNER_EMAIL=${LEVIOSA_DEMO_PARTNER_EMAIL}
      - MOCK_PARTNER_PASSWORD=${LEVIOSA_DEMO_PARTNER_PASSWORD}
      - MOCK_CLIENT_EMAIL=${LEVIOSA_DEMO_CLIENT_EMAIL}
      - MOCK_CLIENT_PASSWORD=${LEVIOSA_DEMO_CLIENT_PASSWORD}
    restart: unless-stopped
    networks:
      - internal

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: homelab-woodpecker-server
    volumes:
      - /opt/homelab/data/woodpecker:/var/lib/woodpecker
    env_file:
      - .env
    environment:
      - WOODPECKER_OPEN=false
      - WOODPECKER_ADMIN=${WOODPECKER_ADMIN}
      - WOODPECKER_HOST=https://ci.henga.dev
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_DATABASE_DRIVER=sqlite3
      - WOODPECKER_DATABASE_DATASOURCE=/var/lib/woodpecker/woodpecker.db
    restart: unless-stopped
    networks:
      - internal

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    container_name: homelab-woodpecker-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_BACKEND=docker
      - WOODPECKER_BACKEND_DOCKER_VOLUMES=/opt/homelab/data/releases:/opt/releases
    depends_on:
      - woodpecker-server
    restart: unless-stopped
    networks:
      - internal

  infisical-db:
    image: postgres:14-alpine
    container_name: homelab-infisical-db
    volumes:
      - /opt/homelab/data/infisical-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=infisical
      - POSTGRES_PASSWORD=${INFISICAL_DB_PASSWORD}
      - POSTGRES_DB=infisical
    restart: unless-stopped
    networks:
      - internal

  infisical-redis:
    image: redis:7-alpine
    container_name: homelab-infisical-redis
    command: redis-server --appendonly yes
    volumes:
      - /opt/homelab/data/infisical-redis:/data
    restart: unless-stopped
    networks:
      - internal

  infisical:
    image: infisical/infisical:latest
    container_name: homelab-infisical
    environment:
      - NODE_ENV=production
      - SITE_URL=https://secrets.${DOMAIN}
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - AUTH_SECRET=${INFISICAL_AUTH_SECRET}
      - DB_CONNECTION_URI=postgresql://infisical:${INFISICAL_DB_PASSWORD}@infisical-db:5432/infisical
      - REDIS_URL=redis://infisical-redis:6379
    depends_on:
      - infisical-db
      - infisical-redis
    restart: unless-stopped
    networks:
      - internal

  # ===========================================================================
  # Observability: metrics, logs, alerts (grafana.henga.dev) and error
  # tracking (errors.henga.dev). The Germinal VPS pushes to ingest.henga.dev.
  # ===========================================================================
  # Every service here has a mem_limit (~2 GB in total, ~850 MB used when
  # idle): the box has 4 GB (swap is only a safety net) and runs Woodpecker
  # builds, so a Loki or Grafana spike must not get Vaultwarden or Infisical
  # OOM-killed.

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.1
    container_name: homelab-victoriametrics
    mem_limit: 384m
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -promscrape.config=/etc/victoriametrics/scrape.yml
    volumes:
      - victoriametrics_data:/storage
      - ./observability/victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    restart: unless-stopped
    networks:
      - internal

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    container_name: homelab-blackbox-exporter
    mem_limit: 64m
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
    networks:
      - internal

  loki:
    image: grafana/loki:3.7.9
    container_name: homelab-loki
    mem_limit: 384m
    command: -config.file=/etc/loki/config.yml
    volumes:
      - loki_data:/loki
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
    restart: unless-stopped
    networks:
      - internal

  grafana:
    image: grafana/grafana:13.2.4
    container_name: homelab-grafana
    mem_limit: 384m
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      # Read by provisioning/alerting/alerting.yml
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
    depends_on:
      - victoriametrics
      - loki
    restart: unless-stopped
    networks:
      - internal

  # Postgres 14 like infisical-db: the backup container's pg_dump
  # (postgresql14-client) must not be older than the server. GlitchTip needs 14+.
  glitchtip-db:
    image: postgres:14-alpine
    container_name: homelab-glitchtip-db
    mem_limit: 256m
    volumes:
      - /opt/homelab/data/glitchtip-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=glitchtip
      - POSTGRES_PASSWORD=${GLITCHTIP_DB_PASSWORD}
      - POSTGRES_DB=glitchtip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  # All-in-one GlitchTip (web + worker in one process) on Postgres alone: no
  # Valkey (VALKEY_URL empty), which keeps it near 300 MB of RAM.
  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    container_name: homelab-glitchtip
    mem_limit: 512m
    environment:
      - DATABASE_URL=postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY}
      - GLITCHTIP_DOMAIN=https://errors.${DOMAIN}
      - CSRF_TRUSTED_ORIGINS=https://errors.${DOMAIN}
      - VALKEY_URL=
      # Web + worker in one process; also runs migrations at start
      - SERVER_ROLE=all_in_one
      # No outgoing mail: alerts go through Grafana/Telegram
      - EMAIL_URL=consolemail://
      - DEFAULT_FROM_EMAIL=glitchtip@${DOMAIN}
      # Accounts are created from the CLI (manage.py createsuperuser)
      - ENABLE_USER_REGISTRATION=False
      - ENABLE_ORGANIZATION_CREATION=False
      - GLITCHTIP_ENABLE_UPTIME=False
      - GLITCHTIP_RETENTION_DAYS=30
    # Migrations run at start and need the database up, not just started
    depends_on:
      glitchtip-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
  proxy:
    external: true

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  # Metrics, logs and Grafana state are disposable or provisioned from this
  # repo: named volumes, no backup.
  victoriametrics_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
