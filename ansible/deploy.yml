---
# Homelab Docker services deployment playbook
# Run with: make deploy (variables passed via -e from Makefile)
- name: Deploy Docker services
  hosts: all
  become: true

  tasks:
    # =========================================================================
    # Prerequisites
    # =========================================================================
    - name: Ensure proxy Docker network exists
      ansible.builtin.command:
        cmd: docker network create proxy --driver bridge
      register: proxy_network
      failed_when: proxy_network.rc != 0 and 'already exists' not in proxy_network.stderr
      changed_when: proxy_network.rc == 0

    # =========================================================================
    # Homelab services
    # =========================================================================
    - name: Create /opt/homelab directory
      ansible.builtin.file:
        path: /opt/homelab
        state: directory
        owner: deploy
        group: deploy
        mode: "0750"

    - name: Create vaultwarden data directory
      ansible.builtin.file:
        path: /opt/homelab/data/vaultwarden
        state: directory
        owner: deploy
        group: deploy
        mode: "0750"

    - name: Create anki data directory
      ansible.builtin.file:
        path: /opt/homelab/data/anki
        state: directory
        owner: deploy
        group: deploy
        mode: "0750"

    - name: Create woodpecker data directory
      ansible.builtin.file:
        path: /opt/homelab/data/woodpecker
        state: directory
        owner: deploy
        group: deploy
        mode: "0750"

    - name: Create releases data directory
      ansible.builtin.file:
        path: /opt/homelab/data/releases
        state: directory
        owner: deploy
        group: deploy
        mode: "0755"

    # No owner/group/mode here on purpose: infisical-db (postgres) and
    # infisical-redis (redis) both chown their PGDATA/data dir to their own
    # container uid on every container start. Asserting deploy:deploy here
    # unconditionally on every playbook run fights that and silently breaks
    # the running container without restarting it (permission-denied errors
    # with no container restart) - bit us in production on 2026-09-10. Just
    # ensure the directory exists; let each container manage ownership.
    - name: Create infisical-db data directory
      ansible.builtin.file:
        path: /opt/homelab/data/infisical-db
        state: directory

    - name: Create infisical-redis data directory
      ansible.builtin.file:
        path: /opt/homelab/data/infisical-redis
        state: directory

    # Same as infisical-db: Postgres owns its data directory.
    - name: Create glitchtip-db data directory
      ansible.builtin.file:
        path: /opt/homelab/data/glitchtip-db
        state: directory

    # =========================================================================
    # Vaultwarden restore (skipped when data directory already has content)
    # =========================================================================
    - name: Check if Vaultwarden data directory is empty
      ansible.builtin.find:
        paths: /opt/homelab/data/vaultwarden
        file_type: any
      register: vaultwarden_data_contents

    - name: Restore Vaultwarden from S3 backup
      when: vaultwarden_data_contents.matched == 0
      block:
        - name: Find latest Vaultwarden backup in S3
          ansible.builtin.shell:
            cmd: >
              aws s3 ls s3://{{ backup_s3_bucket }}/
              | grep 'vaultwarden_'
              | awk '{print $4}'
              | sort
              | tail -1
          environment:
            AWS_ACCESS_KEY_ID: "{{ backup_aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ backup_aws_secret_access_key }}"
            AWS_DEFAULT_REGION: "{{ aws_default_region }}"
          register: latest_backup
          changed_when: false

        - name: Log notice when no backup found in S3
          ansible.builtin.debug:
            msg: "No Vaultwarden backup found in S3, starting fresh"
          when: latest_backup.stdout | trim == ""

        - name: Download latest Vaultwarden backup from S3
          ansible.builtin.command:
            cmd: >
              aws s3 cp
              s3://{{ backup_s3_bucket }}/{{ latest_backup.stdout | trim }}
              /tmp/{{ latest_backup.stdout | trim }}
          environment:
            AWS_ACCESS_KEY_ID: "{{ backup_aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ backup_aws_secret_access_key }}"
            AWS_DEFAULT_REGION: "{{ aws_default_region }}"
          when: latest_backup.stdout | trim != ""
          changed_when: true

        - name: Decrypt Vaultwarden backup
          ansible.builtin.shell:
            cmd: >
              echo "{{ backup_passphrase }}" |
              gpg --batch --yes --passphrase-fd 0
              --decrypt
              --output /tmp/{{ latest_backup.stdout | trim | regex_replace('\.gpg$', '') }}
              /tmp/{{ latest_backup.stdout | trim }}
          when: latest_backup.stdout | trim != ""
          no_log: true
          changed_when: true

        - name: Extract Vaultwarden backup to data directory
          ansible.builtin.command:
            cmd: >
              tar -xzf /tmp/{{ latest_backup.stdout | trim | regex_replace('\.gpg$', '') }}
              -C /opt/homelab/data/vaultwarden
          when: latest_backup.stdout | trim != ""
          changed_when: true

        - name: Remove temporary backup files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/{{ latest_backup.stdout | trim }}"
            - "/tmp/{{ latest_backup.stdout | trim | regex_replace('\\.gpg$', '') }}"
          when: latest_backup.stdout | trim != ""

    # =========================================================================
    # Anki restore (skipped when data directory already has content)
    # =========================================================================
    - name: Check if Anki data directory is empty
      ansible.builtin.find:
        paths: /opt/homelab/data/anki
        file_type: any
      register: anki_data_contents

    - name: Restore Anki from S3 backup
      when: anki_data_contents.matched == 0
      block:
        - name: Find latest Anki backup in S3
          ansible.builtin.shell:
            cmd: >
              aws s3 ls s3://{{ backup_s3_bucket }}/
              | grep 'anki_'
              | awk '{print $4}'
              | sort
              | tail -1
          environment:
            AWS_ACCESS_KEY_ID: "{{ backup_aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ backup_aws_secret_access_key }}"
            AWS_DEFAULT_REGION: "{{ aws_default_region }}"
          register: latest_anki_backup
          changed_when: false

        - name: Log notice when no backup found in S3
          ansible.builtin.debug:
            msg: "No Anki backup found in S3, starting fresh"
          when: latest_anki_backup.stdout | trim == ""

        - name: Download latest Anki backup from S3
          ansible.builtin.command:
            cmd: >
              aws s3 cp
              s3://{{ backup_s3_bucket }}/{{ latest_anki_backup.stdout | trim }}
              /tmp/{{ latest_anki_backup.stdout | trim }}
          environment:
            AWS_ACCESS_KEY_ID: "{{ backup_aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ backup_aws_secret_access_key }}"
            AWS_DEFAULT_REGION: "{{ aws_default_region }}"
          when: latest_anki_backup.stdout | trim != ""
          changed_when: true

        - name: Decrypt Anki backup
          ansible.builtin.shell:
            cmd: >
              echo "{{ backup_passphrase }}" |
              gpg --batch --yes --passphrase-fd 0
              --decrypt
              --output /tmp/{{ latest_anki_backup.stdout | trim | regex_replace('\.gpg$', '') }}
              /tmp/{{ latest_anki_backup.stdout | trim }}
          when: latest_anki_backup.stdout | trim != ""
          no_log: true
          changed_when: true

        - name: Extract Anki backup to data directory
          ansible.builtin.command:
            cmd: >
              tar -xzf /tmp/{{ latest_anki_backup.stdout | trim | regex_replace('\.gpg$', '') }}
              -C /opt/homelab/data/anki
          when: latest_anki_backup.stdout | trim != ""
          changed_when: true

        - name: Remove temporary backup files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/{{ latest_anki_backup.stdout | trim }}"
            - "/tmp/{{ latest_anki_backup.stdout | trim | regex_replace('\\.gpg$', '') }}"
          when: latest_anki_backup.stdout | trim != ""

    # =========================================================================
    # Woodpecker restore (skipped when data directory already has content)
    # =========================================================================
    - name: Check if Woodpecker data directory is empty
      ansible.builtin.find:
        paths: /opt/homelab/data/woodpecker
        file_type: any
      register: woodpecker_data_contents

    - name: Restore Woodpecker from S3 backup
      when: woodpecker_data_contents.matched == 0
      block:
        - name: Find latest Woodpecker backup in S3
          ansible.builtin.shell:
            cmd: >
              aws s3 ls s3://{{ backup_s3_bucket }}/
              | grep 'woodpecker_'
              | awk '{print $4}'
              | sort
              | tail -1
          environment:
            AWS_ACCESS_KEY_ID: "{{ backup_aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ backup_aws_secret_access_key }}"
            AWS_DEFAULT_REGION: "{{ aws_default_region }}"
          register: latest_woodpecker_backup
          changed_when: false

        - name: Log notice when no backup found in S3
          ansible.builtin.debug:
            msg: "No Woodpecker backup found in S3, starting fresh"
          when: latest_woodpecker_backup.stdout | trim == ""

        - name: Download latest Woodpecker backup from S3
          ansible.builtin.command:
            cmd: >
              aws s3 cp
              s3://{{ backup_s3_bucket }}/{{ latest_woodpecker_backup.stdout | trim }}
              /tmp/{{ latest_woodpecker_backup.stdout | trim }}
          environment:
            AWS_ACCESS_KEY_ID: "{{ backup_aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ backup_aws_secret_access_key }}"
            AWS_DEFAULT_REGION: "{{ aws_default_region }}"
          when: latest_woodpecker_backup.stdout | trim != ""
          changed_when: true

        - name: Decrypt Woodpecker backup
          ansible.builtin.shell:
            cmd: >
              echo "{{ backup_passphrase }}" |
              gpg --batch --yes --passphrase-fd 0
              --decrypt
              --output /tmp/{{ latest_woodpecker_backup.stdout | trim | regex_replace('\.gpg$', '') }}
              /tmp/{{ latest_woodpecker_backup.stdout | trim }}
          when: latest_woodpecker_backup.stdout | trim != ""
          no_log: true
          changed_when: true

        - name: Extract Woodpecker backup to data directory
          ansible.builtin.command:
            cmd: >
              tar -xzf /tmp/{{ latest_woodpecker_backup.stdout | trim | regex_replace('\.gpg$', '') }}
              -C /opt/homelab/data/woodpecker
          when: latest_woodpecker_backup.stdout | trim != ""
          changed_when: true

        - name: Remove temporary backup files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/{{ latest_woodpecker_backup.stdout | trim }}"
            - "/tmp/{{ latest_woodpecker_backup.stdout | trim | regex_replace('\\.gpg$', '') }}"
          when: latest_woodpecker_backup.stdout | trim != ""

    - name: Copy docker-compose.yml to server
      ansible.builtin.copy:
        src: ../docker/docker-compose.yml
        dest: /opt/homelab/docker-compose.yml
        owner: deploy
        group: deploy
        mode: "0644"
      tags: [registry]

    - name: Create anki build directory
      ansible.builtin.file:
        path: /opt/homelab/anki
        state: directory
        owner: deploy
        group: deploy
        mode: "0755"

    - name: Copy anki Dockerfile to server
      ansible.builtin.copy:
        src: ../docker/anki/Dockerfile
        dest: /opt/homelab/anki/Dockerfile
        owner: deploy
        group: deploy
        mode: "0644"

    - name: Create anki-api build directory
      ansible.builtin.file:
        path: /opt/homelab/anki-api
        state: directory
        owner: deploy
        group: deploy
        mode: "0755"

    - name: Copy anki-api files to server
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: deploy
        group: deploy
        mode: "0644"
      loop:
        - { src: ../docker/anki-api/Dockerfile, dest: /opt/homelab/anki-api/Dockerfile }
        - { src: ../docker/anki-api/requirements.txt, dest: /opt/homelab/anki-api/requirements.txt }
        - { src: ../docker/anki-api/main.py, dest: /opt/homelab/anki-api/main.py }

    # Config for VictoriaMetrics, Loki, the blackbox exporter and Grafana's
    # provisioning (datasources, dashboards, alert rules, Telegram)
    - name: Copy observability config to server
      ansible.builtin.copy:
        src: ../docker/observability/
        dest: /opt/homelab/observability/
        owner: deploy
        group: deploy
        mode: "0644"
        directory_mode: "0755"
      notify: Restart observability containers

    - name: Copy Caddyfile to server
      ansible.builtin.copy:
        src: ../docker/Caddyfile
        dest: /opt/homelab/Caddyfile
        owner: deploy
        group: deploy
        mode: "0644"
      notify: Restart Caddy container
      tags: [registry]

    # =========================================================================
    # Registry (registry.henga.dev): `make deploy-registry` runs only the
    # tasks tagged `registry`.
    # =========================================================================
    - name: Create the registry directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - /opt/homelab/zot
        - /opt/homelab/data/zot
      tags: [registry]

    - name: Copy the registry config to server
      ansible.builtin.copy:
        src: ../docker/zot/config.json
        dest: /opt/homelab/zot/config.json
        owner: root
        group: root
        mode: "0640"
      notify: Restart registry container
      tags: [registry]

    # community.general.htpasswd needs passlib on the server.
    - name: Install passlib for the registry accounts
      ansible.builtin.apt:
        name: [python3-passlib, python3-bcrypt]
        state: present
      tags: [registry]

    # Zot reloads its htpasswd file on change: no restart.
    - name: Write the registry accounts
      community.general.htpasswd:
        path: /opt/homelab/zot/htpasswd
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        hash_scheme: bcrypt
        owner: root
        group: root
        mode: "0640"
      loop:
        - { name: cluo-ci, password: "{{ registry_ci_password }}" }
        - { name: cluo-vps, password: "{{ registry_vps_password }}" }
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      tags: [registry]

    # Caddy picks up the new site through the Caddyfile copy's handler.
    - name: Start the registry
      ansible.builtin.command:
        cmd: docker compose up -d --no-deps zot
        chdir: /opt/homelab
      changed_when: true
      tags: [never, registry]

    # =========================================================================
    # Disk housekeeping. Woodpecker builds pull CI images and leave the images
    # they build on this host (its Docker daemon does the cluo builds); on
    # 2026-11-18 they filled the 38 GB disk in a day, Woodpecker's SQLite
    # database could not be written and running builds were cancelled.
    # Every hour, drop images no container uses and build cache, both older
    # than 3 hours. `until` looks at when an image was created, so the nightly
    # 24h version kept every cluo image built that day: with several pushes a
    # day the disk reached 94% on 2026-11-22 and the desktop-staging build
    # failed. 3 hours still covers a build in progress. Runs with
    # `make deploy-registry` too: the registry and these images fill the same
    # disk.
    # =========================================================================
    - name: Prune unused Docker images and build cache every hour
      ansible.builtin.cron:
        name: docker-prune
        user: root
        minute: "17"
        job: >-
          docker image prune -af --filter until=3h >/dev/null &&
          docker builder prune -af --filter until=3h >/dev/null
      tags: [housekeeping, registry]

    - name: Copy backup script to server
      ansible.builtin.copy:
        src: ../docker/backup/backup.sh
        dest: /opt/homelab/backup.sh
        owner: deploy
        group: deploy
        mode: "0755"
      notify: Restart backup container

    - name: Template .env file to server
      ansible.builtin.template:
        src: templates/env.j2
        dest: /opt/homelab/.env
        owner: deploy
        group: deploy
        mode: "0600"

    # =========================================================================
    # Infisical Postgres restore (skipped when the DB data directory already
    # has content). Unlike the tar-based restores above, this needs
    # infisical-db actually running and accepting connections before the SQL
    # dump can be piped into it, so it starts that one container early,
    # restores into it, then lets the normal "docker compose up -d" below
    # bring up the rest of the stack (including infisical-db again, which is
    # a no-op since it's already running).
    # =========================================================================
    - name: Check if Infisical Postgres data directory is empty
      ansible.builtin.find:
        paths: /opt/homelab/data/infisical-db
        file_type: any
      register: infisical_data_contents

    - name: Restore Infisical Postgres from S3 backup
      when: infisical_data_contents.matched == 0
      block:
        - name: Find latest Infisical backup in S3
          ansible.builtin.shell:
            cmd: >
              aws s3 ls s3://{{ backup_s3_bucket }}/
              | grep 'infisical_'
              | awk '{print $4}'
              | sort
              | tail -1
          environment:
            AWS_ACCESS_KEY_ID: "{{ backup_aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ backup_aws_secret_access_key }}"
            AWS_DEFAULT_REGION: "{{ aws_default_region }}"
          register: latest_infisical_backup
          changed_when: false

        - name: Log notice when no backup found in S3
          ansible.builtin.debug:
            msg: "No Infisical backup found in S3, starting fresh (Infisical will initialize an empty schema on first boot)"
          when: latest_infisical_backup.stdout | trim == ""

        - name: Start Infisical Postgres so it can accept the restore
          ansible.builtin.command:
            cmd: docker compose up -d infisical-db
            chdir: /opt/homelab
          when: latest_infisical_backup.stdout | trim != ""
          changed_when: true

        - name: Wait for Infisical Postgres to accept connections
          ansible.builtin.command:
            cmd: docker compose exec -T infisical-db pg_isready -U infisical -d infisical
            chdir: /opt/homelab
          register: infisical_pg_ready
          until: infisical_pg_ready.rc == 0
          retries: 10
          delay: 3
          when: latest_infisical_backup.stdout | trim != ""
          changed_when: false

        - name: Download latest Infisical backup from S3
          ansible.builtin.command:
            cmd: >
              aws s3 cp
              s3://{{ backup_s3_bucket }}/{{ latest_infisical_backup.stdout | trim }}
              /tmp/{{ latest_infisical_backup.stdout | trim }}
          environment:
            AWS_ACCESS_KEY_ID: "{{ backup_aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ backup_aws_secret_access_key }}"
            AWS_DEFAULT_REGION: "{{ aws_default_region }}"
          when: latest_infisical_backup.stdout | trim != ""
          changed_when: true

        - name: Decrypt Infisical backup
          ansible.builtin.shell:
            cmd: >
              echo "{{ backup_passphrase }}" |
              gpg --batch --yes --passphrase-fd 0
              --decrypt
              --output /tmp/{{ latest_infisical_backup.stdout | trim | regex_replace('\.gpg$', '') }}
              /tmp/{{ latest_infisical_backup.stdout | trim }}
          when: latest_infisical_backup.stdout | trim != ""
          no_log: true
          changed_when: true

        - name: Restore Infisical Postgres dump
          ansible.builtin.shell:
            cmd: >
              zcat /tmp/{{ latest_infisical_backup.stdout | trim | regex_replace('\.gpg$', '') }}
              | docker compose exec -T infisical-db psql -U infisical -d infisical
            chdir: /opt/homelab
          when: latest_infisical_backup.stdout | trim != ""
          changed_when: true

        - name: Remove temporary backup files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/{{ latest_infisical_backup.stdout | trim }}"
            - "/tmp/{{ latest_infisical_backup.stdout | trim | regex_replace('\\.gpg$', '') }}"
          when: latest_infisical_backup.stdout | trim != ""

    - name: Pull latest Docker images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: /opt/homelab
      changed_when: true

    - name: Start Docker services
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: /opt/homelab
      changed_when: true

  handlers:
    - name: Restart registry container
      ansible.builtin.command:
        cmd: docker compose up -d --no-deps --force-recreate zot
        chdir: /opt/homelab
      changed_when: true

    - name: Restart backup container
      ansible.builtin.command:
        cmd: docker compose restart vaultwarden-backup
        chdir: /opt/homelab
      changed_when: true

    - name: Restart observability containers
      ansible.builtin.command:
        cmd: docker compose restart victoriametrics blackbox-exporter loki grafana
        chdir: /opt/homelab
      changed_when: true

    - name: Restart Caddy container
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate caddy
        chdir: /opt/homelab
      changed_when: true
